plugins {
    id 'com.android.application'
}

android {
    namespace 'de.macschutz'
    compileSdk 36

    defaultConfig {
        // Eindeutige Kennung im Play Store/F-Droid – auf eigener Domain (getshyware.com).
        applicationId 'com.getshyware.macschutz'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signiert wird über Build › Generate Signed App Bundle / APK mit dem eigenen Schlüssel.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kein von Google signierter Abhängigkeits-Block im APK (Vorgabe von F-Droid).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

// Keine externen Bibliotheken: kein Tracking, keine Werbung, kein Internet.
dependencies {
}

// Baseline-Profile werden nicht reproduzierbar erzeugt – für F-Droid abgeschaltet.
tasks.whenTaskAdded { task ->
    if (task.name.contains("ArtProfile")) {
        task.enabled = false
    }
}
